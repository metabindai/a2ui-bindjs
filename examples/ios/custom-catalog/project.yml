# Regenerate with `xcodegen` (brew install xcodegen).
#
# The checked-in `.xcodeproj` is generated from this file. It exists so the example can be
# opened and run without any tooling; this file is the source of truth for what it contains.
name: A2UICustomCatalog

options:
    bundleIdPrefix: ai.metabind
    deploymentTarget:
        iOS: "17.0"
    createIntermediateGroups: true
    groupSortPosition: none

packages:
    # The repository root, whose Package.swift declares the A2UI library. It carries the
    # renderer bundle as a resource and depends on `bindjs-apple` by version.
    A2UI:
        path: ../../..

targets:
    A2UICustomCatalog:
        type: application
        platform: iOS

        sources:
            - path: Sources/A2UICustomCatalog

        dependencies:
            - package: A2UI
              product: A2UI

        info:
            path: Generated/Info.plist
            properties:
                CFBundleDisplayName: A2UI Custom Catalog
                UILaunchScreen: {}
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight

        # Shared, so the checked-in project is runnable without regenerating it.
        scheme:
            testTargets: []

        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: ai.metabind.a2ui.customcatalog
                SWIFT_VERSION: "5.0"
                TARGETED_DEVICE_FAMILY: "1,2"
                ENABLE_USER_SCRIPT_SANDBOXING: NO
