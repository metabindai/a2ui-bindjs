name: Release

# Publishes `@metabindai/a2ui-bindjs` and `@metabindai/a2ui-bindjs-react` from a tag.
#
# The tag follows the version rather than setting it: bump both manifests in a commit, tag
# it `v<version>`, push the tag. The job refuses to publish if the tag and the manifests
# disagree, so a mistyped tag cannot ship the wrong version.
#
# Run it with `workflow_dispatch` first if in doubt — that defaults to a dry run, which
# packs and validates without publishing.
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            dry-run:
                description: Pack and validate without publishing
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    release:
        name: publish to npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  # Writes the .npmrc that reads NODE_AUTH_TOKEN below.
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - name: The tag matches both manifests
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  set -euo pipefail
                  node -e "
                    const { readFileSync } = require('node:fs')
                    const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '')

                    for (const path of ['core/package.json', 'react/package.json']) {
                      const { name, version } = JSON.parse(readFileSync(path, 'utf8'))

                      if (version !== tag) {
                        throw new Error(\`\${name} is \${version} but the tag says \${tag}\`)
                      }

                      console.log(\`\${name} \${version}\`)
                    }
                  "

            # A `private: true` manifest publishes nothing while still reporting success,
            # which is worse than failing. Access is controlled by publishConfig, not this.
            - name: The packages are publishable
              run: |
                  set -euo pipefail
                  node -e "
                    const { readFileSync } = require('node:fs')

                    for (const path of ['core/package.json', 'react/package.json']) {
                      const { name, private: isPrivate } = JSON.parse(readFileSync(path, 'utf8'))

                      if (isPrivate) {
                        throw new Error(name + ' is marked private, so this release would publish nothing.')
                      }
                    }
                  "

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            # `pnpm`, never `npm`. Only pnpm rewrites the `workspace:^` range react uses to
            # depend on core; publishing with npm ships a dependency no consumer can resolve.
            #
            # `--access public`: both packages are public on npm. Passing it on publish sets
            # access the way `npm access set status` does, so `restricted` here would quietly
            # make them private again.
            #
            # `--no-git-checks` because a tag build is a detached HEAD, which pnpm otherwise
            # refuses. `--provenance` is deliberately absent: npm only attests builds from
            # public repositories, so add it when this repo becomes one.
            - name: Publish
              if: ${{ github.event_name == 'push' }}
              run: pnpm publish --recursive --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Dry run
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: pnpm publish --recursive --access public --no-git-checks --dry-run
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
